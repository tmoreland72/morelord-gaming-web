name: Deploy Morelord Gaming Website

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - product-docs-updated
  workflow_dispatch:

concurrency:
  group: morelord-gaming-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Check out Morelord Marketplace documentation
        uses: actions/checkout@v7
        with:
          repository: tmoreland72/morelord-marketplace
          path: .product-docs/morelord-marketplace

      - name: Check out Morelord Core documentation
        uses: actions/checkout@v7
        with:
          repository: tmoreland72/morelord-core
          path: .product-docs/morelord-core

      - name: Check out Morelord Character Export documentation
        uses: actions/checkout@v7
        with:
          repository: tmoreland72/morelord-character-export
          path: .product-docs/morelord-character-export

      - name: Check out Morelord Craftworks documentation
        uses: actions/checkout@v7
        with:
          repository: tmoreland72/morelord-craftworks
          path: .product-docs/morelord-craftworks

      - name: Check out Morelord Encounters documentation
        uses: actions/checkout@v7
        with:
          repository: tmoreland72/morelord-encounters
          path: .product-docs/morelord-encounters

      - name: Check out Morelord Journeys documentation
        uses: actions/checkout@v7
        with:
          repository: tmoreland72/morelord-journeys
          path: .product-docs/morelord-journeys

      - name: Check out Morelord Downtime documentation
        uses: actions/checkout@v7
        with:
          repository: tmoreland72/morelord-downtime
          path: .product-docs/morelord-downtime

      - name: Check out Morelord Game Master documentation
        uses: actions/checkout@v7
        with:
          repository: tmoreland72/morelord-game-master
          ref: master
          path: .product-docs/morelord-game-master

      - name: Synchronize product documentation
        run: npm run docs:sync

      - name: Install dependencies
        run: npm ci

      - name: Check Svelte and TypeScript
        run: npm run check

      - name: Build validation worker
        run: npm run build
        env:
          BETTER_AUTH_SECRET: ci-validation-only-secret-more-than-32-characters
          ORIGIN: http://localhost:5173

  deploy:
    name: Migrate and deploy
    needs: validate
    runs-on: ubuntu-latest
    environment: production

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_PRICE_PREMIUM_MONTHLY: ${{ secrets.STRIPE_PRICE_PREMIUM_MONTHLY }}
      STRIPE_PRICE_PREMIUM_ANNUAL: ${{ secrets.STRIPE_PRICE_PREMIUM_ANNUAL }}
      STRIPE_PRICE_CHAMPION_MONTHLY: ${{ secrets.STRIPE_PRICE_CHAMPION_MONTHLY }}
      STRIPE_PRICE_CHAMPION_ANNUAL: ${{ secrets.STRIPE_PRICE_CHAMPION_ANNUAL }}
      DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
      DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
      DISCORD_INVITE_URL: ${{ secrets.DISCORD_INVITE_URL }}

      ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
      ORIGIN: ${{ vars.ORIGIN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Check out Morelord Marketplace documentation
        uses: actions/checkout@v7
        with:
          repository: tmoreland72/morelord-marketplace
          path: .product-docs/morelord-marketplace

      - name: Check out Morelord Core documentation
        uses: actions/checkout@v7
        with:
          repository: tmoreland72/morelord-core
          path: .product-docs/morelord-core

      - name: Check out Morelord Character Export documentation
        uses: actions/checkout@v7
        with:
          repository: tmoreland72/morelord-character-export
          path: .product-docs/morelord-character-export

      - name: Check out Morelord Craftworks documentation
        uses: actions/checkout@v7
        with:
          repository: tmoreland72/morelord-craftworks
          path: .product-docs/morelord-craftworks

      - name: Check out Morelord Encounters documentation
        uses: actions/checkout@v7
        with:
          repository: tmoreland72/morelord-encounters
          path: .product-docs/morelord-encounters

      - name: Check out Morelord Journeys documentation
        uses: actions/checkout@v7
        with:
          repository: tmoreland72/morelord-journeys
          path: .product-docs/morelord-journeys

      - name: Check out Morelord Downtime documentation
        uses: actions/checkout@v7
        with:
          repository: tmoreland72/morelord-downtime
          path: .product-docs/morelord-downtime

      - name: Check out Morelord Game Master documentation
        uses: actions/checkout@v7
        with:
          repository: tmoreland72/morelord-game-master
          ref: master
          path: .product-docs/morelord-game-master

      - name: Synchronize product documentation
        run: npm run docs:sync

      - name: Install dependencies
        run: npm ci

      - name: Validate required deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          required=(
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            BETTER_AUTH_SECRET
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
            RELEASE_PUBLISH_TOKEN
            ADMIN_EMAILS
            ORIGIN
          )

          missing=()

          for name in "${required[@]}"; do
            value="${!name:-}"

            if [ -z "${value//[[:space:]]/}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required production configuration:\n'
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Build production worker
        run: npm run build
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          ORIGIN: ${{ vars.ORIGIN }}

      - name: Apply production D1 migrations
        run: npx wrangler d1 migrations apply morelord-gaming --remote

      # Secrets ride on the version that wrangler deploy uploads. A separate
      # `wrangler versions secret bulk` creates an undeployed version, and the
      # action's `secrets:` input then calls legacy `wrangler secret bulk`,
      # which Cloudflare rejects with error 10215. `--secrets-file` puts these
      # values on the deployed version. Names omitted from the file are kept.
      - name: Prepare runtime secrets file
        shell: bash
        env:
          RUNTIME_SECRETS_FILE: ${{ runner.temp }}/morelord-runtime-secrets.json
        run: |
          set -euo pipefail
          umask 077

          jq -n \
            --arg BETTER_AUTH_SECRET "$BETTER_AUTH_SECRET" \
            --arg GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID" \
            --arg GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET" \
            --arg RELEASE_PUBLISH_TOKEN "$RELEASE_PUBLISH_TOKEN" \
            --arg ADMIN_EMAILS "$ADMIN_EMAILS" \
            --arg ORIGIN "$ORIGIN" \
            '{
              BETTER_AUTH_SECRET: $BETTER_AUTH_SECRET,
              GOOGLE_CLIENT_ID: $GOOGLE_CLIENT_ID,
              GOOGLE_CLIENT_SECRET: $GOOGLE_CLIENT_SECRET,
              RELEASE_PUBLISH_TOKEN: $RELEASE_PUBLISH_TOKEN,
              ADMIN_EMAILS: $ADMIN_EMAILS,
              ORIGIN: $ORIGIN
            }' > "$RUNTIME_SECRETS_FILE"

          if [ -n "${STRIPE_SECRET_KEY:-}" ]; then
            required=(STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_PRICE_PREMIUM_MONTHLY STRIPE_PRICE_PREMIUM_ANNUAL STRIPE_PRICE_CHAMPION_MONTHLY STRIPE_PRICE_CHAMPION_ANNUAL)
            for name in "${required[@]}"; do
              if [ -z "${!name:-}" ]; then echo "Stripe is partially configured; missing $name"; exit 1; fi
            done
            stripe_file="$(mktemp)"
            jq -n \
              --arg STRIPE_SECRET_KEY "$STRIPE_SECRET_KEY" \
              --arg STRIPE_WEBHOOK_SECRET "$STRIPE_WEBHOOK_SECRET" \
              --arg STRIPE_PRICE_PREMIUM_MONTHLY "$STRIPE_PRICE_PREMIUM_MONTHLY" \
              --arg STRIPE_PRICE_PREMIUM_ANNUAL "$STRIPE_PRICE_PREMIUM_ANNUAL" \
              --arg STRIPE_PRICE_CHAMPION_MONTHLY "$STRIPE_PRICE_CHAMPION_MONTHLY" \
              --arg STRIPE_PRICE_CHAMPION_ANNUAL "$STRIPE_PRICE_CHAMPION_ANNUAL" \
              '{
                STRIPE_SECRET_KEY: $STRIPE_SECRET_KEY,
                STRIPE_WEBHOOK_SECRET: $STRIPE_WEBHOOK_SECRET,
                STRIPE_PRICE_PREMIUM_MONTHLY: $STRIPE_PRICE_PREMIUM_MONTHLY,
                STRIPE_PRICE_PREMIUM_ANNUAL: $STRIPE_PRICE_PREMIUM_ANNUAL,
                STRIPE_PRICE_CHAMPION_MONTHLY: $STRIPE_PRICE_CHAMPION_MONTHLY,
                STRIPE_PRICE_CHAMPION_ANNUAL: $STRIPE_PRICE_CHAMPION_ANNUAL
              }' > "$stripe_file"
            jq -s '.[0] * .[1]' "$RUNTIME_SECRETS_FILE" "$stripe_file" > "${RUNTIME_SECRETS_FILE}.next"
            mv "${RUNTIME_SECRETS_FILE}.next" "$RUNTIME_SECRETS_FILE"
            rm -f "$stripe_file"
          fi

          if [ -n "${DISCORD_CLIENT_ID:-}" ] || [ -n "${DISCORD_CLIENT_SECRET:-}" ] || [ -n "${DISCORD_BOT_TOKEN:-}" ] || [ -n "${DISCORD_RELEASE_WEBHOOK_URL:-}" ] || [ -n "${DISCORD_INVITE_URL:-}" ]; then
            if [ -n "${DISCORD_CLIENT_ID:-}" ] || [ -n "${DISCORD_CLIENT_SECRET:-}" ] || [ -n "${DISCORD_BOT_TOKEN:-}" ]; then
              required=(DISCORD_CLIENT_ID DISCORD_CLIENT_SECRET)
              for name in "${required[@]}"; do
                if [ -z "${!name:-}" ]; then echo "Discord OAuth is partially configured; missing $name"; exit 1; fi
              done
            fi
            discord_file="$(mktemp)"
            jq -n \
              --arg DISCORD_CLIENT_ID "${DISCORD_CLIENT_ID:-}" \
              --arg DISCORD_CLIENT_SECRET "${DISCORD_CLIENT_SECRET:-}" \
              --arg DISCORD_BOT_TOKEN "${DISCORD_BOT_TOKEN:-}" \
              --arg DISCORD_RELEASE_WEBHOOK_URL "${DISCORD_RELEASE_WEBHOOK_URL:-}" \
              --arg DISCORD_INVITE_URL "${DISCORD_INVITE_URL:-}" \
              '{
                DISCORD_CLIENT_ID: $DISCORD_CLIENT_ID,
                DISCORD_CLIENT_SECRET: $DISCORD_CLIENT_SECRET,
                DISCORD_BOT_TOKEN: $DISCORD_BOT_TOKEN,
                DISCORD_RELEASE_WEBHOOK_URL: $DISCORD_RELEASE_WEBHOOK_URL,
                DISCORD_INVITE_URL: $DISCORD_INVITE_URL
              } | with_entries(select(.value != ""))' > "$discord_file"
            jq -s '.[0] * .[1]' "$RUNTIME_SECRETS_FILE" "$discord_file" > "${RUNTIME_SECRETS_FILE}.next"
            mv "${RUNTIME_SECRETS_FILE}.next" "$RUNTIME_SECRETS_FILE"
            rm -f "$discord_file"
          fi

          echo "Runtime secrets included in this deploy:"
          jq -r 'keys[]' "$RUNTIME_SECRETS_FILE"

      - name: Deploy Worker and runtime configuration
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --secrets-file "${{ runner.temp }}/morelord-runtime-secrets.json"

      - name: Remove runtime secrets file
        if: always()
        run: rm -f "${{ runner.temp }}/morelord-runtime-secrets.json" "${{ runner.temp }}/morelord-runtime-secrets.json.next"

      - name: Verify production health
        if: ${{ vars.PRODUCTION_URL != '' }}
        shell: bash
        run: |
          set -euo pipefail

          base_url="${{ vars.PRODUCTION_URL }}"
          base_url="${base_url%/}"

          echo "Checking ${base_url}/api/health"

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            "${base_url}/api/health"

          echo
          echo "Checking ${base_url}/api/system/auth-status is not public"

          auth_status="$(
            curl \
              --silent \
              --show-error \
              --retry 5 \
              --retry-delay 5 \
              --output /tmp/auth-status.json \
              --write-out '%{http_code}' \
              "${base_url}/api/system/auth-status"
          )"

          if [ "${auth_status}" != "404" ]; then
            echo "Expected 404 for anonymous /api/system/auth-status, got ${auth_status}"
            cat /tmp/auth-status.json
            echo
            exit 1
          fi

          echo "Anonymous auth-status correctly returned 404"

name: Deploy Morelord Gaming Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: morelord-gaming-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Svelte and TypeScript
        run: npm run check

      - name: Build validation worker
        run: npm run build
        env:
          BETTER_AUTH_SECRET: ci-validation-only-secret-more-than-32-characters
          ORIGIN: http://localhost:5173

  deploy:
    name: Migrate and deploy
    needs: validate
    runs-on: ubuntu-latest
    environment: production

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}

      ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
      ORIGIN: ${{ vars.ORIGIN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          required=(
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            BETTER_AUTH_SECRET
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
            RELEASE_PUBLISH_TOKEN
            ADMIN_EMAILS
            ORIGIN
          )

          missing=()

          for name in "${required[@]}"; do
            value="${!name:-}"

            if [ -z "${value//[[:space:]]/}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required production configuration:\n'
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Build production worker
        run: npm run build
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          ORIGIN: ${{ vars.ORIGIN }}

      - name: Apply production D1 migrations
        run: npx wrangler d1 migrations apply morelord-gaming --remote

      - name: Deploy Worker and runtime configuration
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            BETTER_AUTH_SECRET
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
            RELEASE_PUBLISH_TOKEN
            ADMIN_EMAILS
            ORIGIN
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          ORIGIN: ${{ vars.ORIGIN }}

      - name: Verify production health
        if: ${{ vars.PRODUCTION_URL != '' }}
        shell: bash
        run: |
          set -euo pipefail

          base_url="${{ vars.PRODUCTION_URL }}"
          base_url="${base_url%/}"

          echo "Checking ${base_url}/api/health"

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            "${base_url}/api/health"

          echo
          echo "Checking ${base_url}/api/system/auth-status"

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            "${base_url}/api/system/auth-status"

          echo
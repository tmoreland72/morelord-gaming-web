name: Deploy Morelord Gaming Website

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - product-docs-updated
  workflow_dispatch:

concurrency:
  group: morelord-gaming-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Check out Morelord Marketplace documentation
        uses: actions/checkout@v4
        with:
          repository: tmoreland72/morelord-marketplace
          path: .product-docs/morelord-marketplace

      - name: Synchronize product documentation
        run: npm run docs:sync

      - name: Install dependencies
        run: npm ci

      - name: Check Svelte and TypeScript
        run: npm run check

      - name: Build validation worker
        run: npm run build
        env:
          BETTER_AUTH_SECRET: ci-validation-only-secret-more-than-32-characters
          ORIGIN: http://localhost:5173

  deploy:
    name: Migrate and deploy
    needs: validate
    runs-on: ubuntu-latest
    environment: production

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_PRICE_PREMIUM_MONTHLY: ${{ secrets.STRIPE_PRICE_PREMIUM_MONTHLY }}
      STRIPE_PRICE_PREMIUM_ANNUAL: ${{ secrets.STRIPE_PRICE_PREMIUM_ANNUAL }}
      STRIPE_PRICE_CHAMPION_MONTHLY: ${{ secrets.STRIPE_PRICE_CHAMPION_MONTHLY }}
      STRIPE_PRICE_CHAMPION_ANNUAL: ${{ secrets.STRIPE_PRICE_CHAMPION_ANNUAL }}
      DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
      DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}

      ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
      ORIGIN: ${{ vars.ORIGIN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Check out Morelord Marketplace documentation
        uses: actions/checkout@v4
        with:
          repository: tmoreland72/morelord-marketplace
          path: .product-docs/morelord-marketplace

      - name: Synchronize product documentation
        run: npm run docs:sync

      - name: Install dependencies
        run: npm ci

      - name: Validate required deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          required=(
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            BETTER_AUTH_SECRET
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
            RELEASE_PUBLISH_TOKEN
            ADMIN_EMAILS
            ORIGIN
          )

          missing=()

          for name in "${required[@]}"; do
            value="${!name:-}"

            if [ -z "${value//[[:space:]]/}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required production configuration:\n'
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Build production worker
        run: npm run build
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          ORIGIN: ${{ vars.ORIGIN }}

      - name: Apply production D1 migrations
        run: npx wrangler d1 migrations apply morelord-gaming --remote

      - name: Upload optional Stripe runtime secrets
        if: ${{ env.STRIPE_SECRET_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          required=(STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_PRICE_PREMIUM_MONTHLY STRIPE_PRICE_PREMIUM_ANNUAL STRIPE_PRICE_CHAMPION_MONTHLY STRIPE_PRICE_CHAMPION_ANNUAL)
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then echo "Stripe is partially configured; missing $name"; exit 1; fi
          done
          jq -n \
            --arg secret "$STRIPE_SECRET_KEY" \
            --arg webhook "$STRIPE_WEBHOOK_SECRET" \
            --arg pm "$STRIPE_PRICE_PREMIUM_MONTHLY" \
            --arg pa "$STRIPE_PRICE_PREMIUM_ANNUAL" \
            --arg cm "$STRIPE_PRICE_CHAMPION_MONTHLY" \
            --arg ca "$STRIPE_PRICE_CHAMPION_ANNUAL" \
            '{STRIPE_SECRET_KEY:$secret,STRIPE_WEBHOOK_SECRET:$webhook,STRIPE_PRICE_PREMIUM_MONTHLY:$pm,STRIPE_PRICE_PREMIUM_ANNUAL:$pa,STRIPE_PRICE_CHAMPION_MONTHLY:$cm,STRIPE_PRICE_CHAMPION_ANNUAL:$ca}' \
            | npx wrangler secret bulk

      - name: Upload optional Discord runtime secrets
        if: ${{ env.DISCORD_CLIENT_ID != '' || env.DISCORD_CLIENT_SECRET != '' || env.DISCORD_BOT_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          required=(DISCORD_CLIENT_ID DISCORD_CLIENT_SECRET DISCORD_BOT_TOKEN)
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then echo "Discord is partially configured; missing $name"; exit 1; fi
          done
          jq -n \
            --arg client "$DISCORD_CLIENT_ID" \
            --arg secret "$DISCORD_CLIENT_SECRET" \
            --arg bot "$DISCORD_BOT_TOKEN" \
            '{DISCORD_CLIENT_ID:$client,DISCORD_CLIENT_SECRET:$secret,DISCORD_BOT_TOKEN:$bot}' \
            | npx wrangler secret bulk

      - name: Deploy Worker and runtime configuration
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            BETTER_AUTH_SECRET
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
            RELEASE_PUBLISH_TOKEN
            ADMIN_EMAILS
            ORIGIN
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          ORIGIN: ${{ vars.ORIGIN }}

      - name: Verify production health
        if: ${{ vars.PRODUCTION_URL != '' }}
        shell: bash
        run: |
          set -euo pipefail

          base_url="${{ vars.PRODUCTION_URL }}"
          base_url="${base_url%/}"

          echo "Checking ${base_url}/api/health"

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            "${base_url}/api/health"

          echo
          echo "Checking ${base_url}/api/system/auth-status"

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            "${base_url}/api/system/auth-status"

          echo
